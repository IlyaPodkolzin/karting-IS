services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kartbook}
      POSTGRES_USER: ${POSTGRES_USER:-kartbook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kartbook_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kartbook_user} -d ${POSTGRES_DB:-kartbook}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - karting_network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://kartbook_user:kartbook_pass@db:5432/kartbook}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production_32chars}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:5173","http://localhost:80"]'}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - karting_network
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_API_V1_PREFIX: ${VITE_API_V1_PREFIX:-/api/v1}
    depends_on:
      - backend
    networks:
      - karting_network

volumes:
  postgres_data:

networks:
  karting_network:
    driver: bridge