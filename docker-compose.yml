version: "3.9"

# ── Usage ─────────────────────────────────────────────────────────────────────
# 1. cp backend/.env.example backend/.env   && edit backend/.env
# 2. cp frontend/.env.example frontend/.env && edit frontend/.env
# 3. docker-compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kartbook
      POSTGRES_USER: kartbook_user
      POSTGRES_PASSWORD: kartbook_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kartbook_user -d kartbook"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env          # ← all secrets come from here, never hardcoded
    environment:
      # Override DATABASE_URL to use Docker service name instead of localhost
      DATABASE_URL: postgresql://kartbook_user:kartbook_pass@db:5432/kartbook
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/scripts:/app/scripts
      - uploads_data:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env         # ← VITE_API_URL and VITE_YANDEX_MAPS_API_KEY
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
